# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
# hatchling is the wheel build backend on every path: `pip install`,
# `uv build`, `uv sync`, and conda-forge (which pip-installs the sdist).
# Pinned exactly (#85): release recovery must be able to rebuild a tag's
# artifacts byte-identically, so the backend cannot float between builds.
[build-system]
requires = ["hatchling==1.31.0", "uv-dynamic-versioning==0.14.0"]
build-backend = "hatchling.build"

[project]
name = "datamaite"
# The version is derived from the git tag (uv-dynamic-versioning, #85): the
# tag is the single source of truth and there is no version bump commit.
# Exposed at runtime via importlib.metadata (see src/datamaite/_version.py).
dynamic = ["version"]
description = "A unified framework for dataset loading, conversion, and quality validation."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "OpenTeams" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10,<3.15"

# The python_version splits mirror wheel availability (#82, same rationale as
# modelmaite): numpy ships cp313 wheels from 2.1 and cp314 from 2.3.2, and
# pydantic's compiled core supports 3.14 from pydantic 2.12. Without the
# markers, a metadata-driven resolver (uv's universal lock) could pick
# an uninstallable version on the newest interpreters.
dependencies = [
    "pydantic>=2.0; python_version < '3.14'",
    "pydantic>=2.12; python_version >= '3.14'",
    "numpy>=1.24; python_version < '3.13'",
    "numpy>=2.1; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    # 2024.5.0 is universal-pathlib 0.3.8's own declared floor (verified via
    # importlib.metadata.requires("universal_pathlib")); pinning below that
    # lets pip resolve an fsspec too old for the UPath surface we depend on.
    "fsspec>=2024.5.0",
    "universal-pathlib>=0.3.8",
]

[project.optional-dependencies]
# Task-oriented extras. Core stays lean (pydantic + numpy) and every optional
# native/media stack is pulled by the task that needs pixels.
# opencv-python-headless ships abi3 wheels, so it installs on every supported
# interpreter including 3.14 (its own numpy metadata steers old releases away
# from numpy-2 environments). av ships per-version wheels; cp314 exists only
# from av 15.1, hence the marker split (#82).
fmv = [
    "opencv-python-headless>=4.8",
    "av>=11; python_version < '3.14'",
    "av>=15.1; python_version >= '3.14'",
]
od = [
    "opencv-python-headless>=4.8",
]
ic = [
    "opencv-python-headless>=4.8",
]
all = [
    "opencv-python-headless>=4.8",
    "av>=11; python_version < '3.14'",
    "av>=15.1; python_version >= '3.14'",
]
# Cloud object-storage backends for loading datasets from s3:// / gs:// / az://
# URLs. Core ships fsspec + universal-pathlib; each provider's filesystem is
# opt-in, mirroring CheckMAITE's extras.
aws = [
    "s3fs>=2023.1.0",
]
gcs = [
    "gcsfs>=2023.1.0",
]
azure = [
    "adlfs>=2023.1.0",
]
cloud = [
    "s3fs>=2023.1.0",
    "gcsfs>=2023.1.0",
    "adlfs>=2023.1.0",
]
# Jupyter kernel for running the docs/tutorial notebooks. Optional so it does
# not pull the Jupyter stack into a production install.
notebook = [
    "ipykernel>=7.2",
    "jupyterlab",
]
# MAITE interoperability (datamaite.maite). Optional: core `import datamaite`
# never imports these. ``numpy`` + ``av`` (PyAV) are the real runtime deps --
# they build/decode the MOT view. ``maite`` itself is NOT imported at runtime
# (BoxTrackDataset conforms to maite.protocols *structurally*); it's shipped in
# this extra for the consumer's convenience -- anyone consuming the MAITE
# surface has maite installed anyway -- and the test suite uses it to verify
# conformance (isinstance + a maite.tasks.predict round-trip).
maite = [
    "maite>=0.9",
    "numpy>=1.24; python_version < '3.13'",
    "numpy>=2.1; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "av>=11; python_version < '3.14'",
    "av>=15.1; python_version >= '3.14'",
]
dev = [
    "pre-commit>=3.6",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "bandit[toml]>=1.7",
    "pyright>=1.1",
    "maite>=0.9,<0.10",
    "safetensors>=0.4",
]
# Docs toolchain plus notebook/runtime deps. myst-nb executes tutorial
# notebooks during the Sphinx build, so their imports (cv2 / av / maite) and
# the Jupyter kernel must be present. PEP 621 extras cannot include other
# extras, so docs lists those runtime packages directly.
docs = [
    "maite>=0.9", # maite
    "numpy>=1.24",# maite; core dependency supplies the per-interpreter floor
    "av>=11; python_version < '3.14'",     # maite/fmv/all
    "av>=15.1; python_version >= '3.14'",  # maite/fmv/all
    "ipykernel>=7.2", # notebook
    "opencv-python-headless>=4.8", # fmv/od/ic/all
    "sphinx>=7.0",
    "myst-nb>=1.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-design>=0.5",          # grid/card tiles on the landing page
    "sphinxcontrib-mermaid>=0.9",  # render ```mermaid fences as diagrams
    "sphinx-autobuild>=2024.0",    # live-reload rebuild for local docs editing
]

[project.scripts]
datamaite = "datamaite._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datamaite"]

[tool.hatch.build.targets.sdist]
# Allowlist, not denylist: an sdist built from a working checkout must ship
# only the package and its tests, never whatever untracked local files
# happen to sit in the tree (docs notebooks, developer tools/ scripts,
# scratch data). pyproject.toml, README.md, and the license are always
# included by the build backend.
only-include = ["src", "tests"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
# The version is dynamic (derived from the git tag), but uv's default cache keys
# for the root project are the source files -- so a moved commit or a new tag
# does NOT invalidate the built editable wheel, and `uv sync` keeps a stale
# baked version even after `.venv` is deleted. Declaring git commit/tags as
# cache keys is uv's documented remedy for dynamic versions. This is what keeps
# CI honest too: jobs restore a cached .venv, and without it the docs jobs would
# publish whatever version was baked when that cache entry was first written.
# Does not affect
# resolution, so `uv lock --check` still passes without relocking.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"  # our tags are X.Y.Z with no v prefix
fallback-version = "0.0.0"      # used when git history/tags are unavailable (e.g. tarball checkouts)

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/datamaite/_version.py"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "C90",  # mccabe complexity
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PD",   # pandas-vet
    "RUF",  # ruff-specific rules
    "PERF", # perflint
]
ignore = [
    "ISC001",  # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["datamaite"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=datamaite",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage_report.xml",
    "--cov-fail-under=90",
    "-ra",
    "-m",
    "not real_data and not integration",
]
markers = [
    "integration: marks tests requiring external resources (opt-in via -m integration; e.g. the example-data conversion matrix, needs DATAMAITE_DATASETS_ROOT)",
    "real_data: marks tests that require real HMIE data on SUNet (opt-in via -m real_data)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
omit = [
    "src/datamaite/conversion.py",
]

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests"]
reportMissingImports = "warning"
reportMissingTypeStubs = false

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src", "tools"]
exclude_dirs = ["tests"]

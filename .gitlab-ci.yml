workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Only release-shaped tags get a pipeline: suffixes are limited to the
    # forms uv-dynamic-versioning can actually build (rc/alpha/beta, .post,
    # .dev). A v-prefixed or arbitrary tag (docs-2026) never starts a doomed
    # pipeline, and never sees protected variables. Numeric components reject
    # leading zeros ((0|[1-9]\d*)): a tag like 01.02.03 would build artifacts
    # canonicalized to 1.2.3 -- passing the exact-version guard via PEP 440
    # equality while the tag/changelog/Release say 01.02.03, and colliding
    # with a later genuine 1.2.3.
    - if: '$CI_COMMIT_TAG =~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(rc|alpha|beta)(0|[1-9]\d*)|\.(post|dev)(0|[1-9]\d*))?$/'

default:
  # Only retry on infrastructure failures, never on test/lint failures --
  # unconditional retry masks flaky tests and hides real intermittents.
  retry:
    max: 1
    when: runner_system_failure
  artifacts:
    expire_in: 1 week

stages:
  - lint
  - typecheck
  - build
  - test
  - dr-compliance
  - pages
  - publish-test
  - publish
  - release

variables:
  # Cache under the project dir so GitLab can archive it, and on the same
  # filesystem as .venv so uv hardlinks rather than copies.
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  # Download-cache policy: every job reads it, exactly one job writes it (see
  # `lint`). Eleven writers under one key would re-upload ~110MB each per
  # pipeline, last-writer-wins, for no benefit.
  UV_DOWNLOAD_CACHE_POLICY: "pull"
  # Full clone history + tags: uv-dynamic-versioning derives the package
  # version from the git tag (#85), so every build needs real history.
  GIT_DEPTH: "0"
  # Pin uv to avoid silent drift.
  UV_PIN: "0.10.6"
  # Never download a managed interpreter: each job runs on the Python that ships
  # in its own python:${VERSION}-slim image, which is the only one present.
  # Deliberately NOT paired with UV_PYTHON -- an environment-provided interpreter
  # *name* is only a discovery preference and is silently ignored in favour of an
  # existing .venv, so it cannot pin anything. The interpreter is pinned by
  # putting ${VERSION} in the venv cache key instead (see `cache:` below), which
  # stops a wrong-version .venv from being restored in the first place.
  UV_PYTHON_DOWNLOADS: "never"
  # Pin the PEP 517 build environment everywhere, not just in the release job:
  # `uv sync` installs the root project through hatchling, so every job now
  # resolves hatchling + uv-dynamic-versioning and their transitive closure.
  UV_BUILD_CONSTRAINT: "$CI_PROJECT_DIR/scripts/publish-build-constraints.txt"

# Clone the shared example-datasets repo to one canonical location used by every
# job that needs it (docs build + e2e integration matrix), and export
# DATAMAITE_DATASETS_ROOT so the tutorial notebooks and e2e tests both resolve
# datasets the same way. The repo stores media (.mp4/.jpg/...) in git-LFS.
.clone_example_data: &clone_example_data
  # Trust the GitLab checkout for build backends that call git to derive package metadata.
  - git config --global --add safe.directory "$CI_PROJECT_DIR"
  # Register the LFS smudge/clean filters (global; the apt git-lfs package only
  # installs the binary, not the git config).
  - git lfs install
  # Derive host + namespace instead of hardcoding them (CI_PROJECT_NAMESPACE ==
  # jatic/orchestration-interoperability); CI_JOB_TOKEN authorizes the cross-repo
  # clone (allowlisted in the datasets project's job-token permissions).
  - git clone --depth 1
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/datamaite-example-datasets.git"
      "${CI_PROJECT_DIR}/example-data"
  # Pull explicitly so the shallow clone gets real binaries, not LFS pointers.
  - git -C "${CI_PROJECT_DIR}/example-data" lfs pull
  # Both the notebooks and the e2e tests read this env var to locate the
  # datasets. Absolute path so it resolves regardless of execution CWD.
  - export DATAMAITE_DATASETS_ROOT="${CI_PROJECT_DIR}/example-data/datasets"

.shared-setup:
  interruptible: true
  image: python:${VERSION}-slim
  timeout: 20m
  before_script:
    # Install OS deps required by our toolchain:
    #   git        -- pre-commit needs it; slim images don't ship it
    #   git-lfs    -- the example-datasets repo stores media (.mp4/.jpg/...) in
    #                 git-LFS; without it `git clone` yields pointer files and the
    #                 tutorial notebooks fail to decode video in the docs build
    #   libatomic1 -- pyright's embedded Node runtime needs it
    - apt-get update -qq && apt-get install -y -qq git git-lfs libatomic1
    # Trust the GitLab checkout for build backends that call git to derive package metadata.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Acquire uv from PyPI, matching the publish job below and both sibling repos
    # (checkmaite, modelmaite). Preferred over astral.sh's install script: that
    # script performs no integrity check on the binary it downloads ("no
    # checksums to verify"), and pins only a *name* on a GitHub release asset,
    # which can be replaced in place -- whereas a PyPI filename is immutable.
    # These jobs receive protected CI variables on tag pipelines.
    - pip install --quiet "uv==${UV_PIN}"
    - python --version
    - uv --version
    # Nothing else asserts the pin actually took effect. Exact match on the
    # version field, not a substring: `uv --version` prints
    # "uv <version> (<hash> <date>)", so the whole string never equals the pin.
    - test "$(uv --version | cut -d' ' -f2)" = "${UV_PIN}"
    # Fail fast if uv.lock has drifted from pyproject.toml (SR-3-H-4).
    - uv lock --check
  cache:
    # Keyed per job AND per interpreter version. The version in the key is
    # load-bearing: a restored .venv silently wins over an environment-provided
    # UV_PYTHON *name* request, so a key without ${VERSION} let a job bump its
    # VERSION and keep running on the old interpreter, with `python --version`
    # printing the new one and nothing checking .venv. Seven jobs have
    # version-agnostic names, so CI_JOB_NAME alone does not encode it.
    # The companion fix for stale *versions* is `[tool.uv] cache-keys` in
    # pyproject.toml, which re-roots the project when the commit or tag moves --
    # `uv sync` otherwise reuses the built editable wheel even after .venv is
    # deleted, and the docs jobs would publish a stale version.
    - key:
        files:
          - uv.lock
        # No ref-slug: every tag is a fresh ref, so a per-ref key made release
        # pipelines rebuild all venvs cold. uv.lock fingerprints content, and
        # protected/unprotected cache separation isolates release caches.
        prefix: "venv-${CI_JOB_NAME}-py${VERSION}"
      paths:
        - .venv/
    # uv's download cache, with a deliberately STATIC key -- no `files:`. That is
    # the point of it: the .venv entry above is fingerprinted on uv.lock, so any
    # dependency change invalidates all 11 uv-using jobs' environments in the
    # same pipeline, and this is the only entry that survives to serve that
    # cold-venv case. Measured: cold .venv with this cache present rebuilds the
    # whole environment via `uv sync --locked --offline` with zero network; with
    # it absent the same sync must reach PyPI (which is how a PyPI outage turned
    # a dependency bump into four manual retries). A warm .venv needs no
    # downloads either way, so this earns its keep only on lock changes -- which
    # is exactly when every job needs it at once.
    #
    # `uv cache prune --ci` is NOT used: it cuts 114MB to 1MB, but uv stores
    # registry wheels unzipped, so pruning the unzipped form removes what an
    # offline install needs. Size is bounded by the single-writer policy instead.
    - key: uv-downloads
      paths:
        - .cache/uv
      policy: ${UV_DOWNLOAD_CACHE_POLICY}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
# First gate of every release (#85): a tag with no matching, non-empty
# CHANGELOG.md section fails here, before anything is built or published.
# The same section later becomes the GitLab Release notes (gitlab-release).
changelog-check:
  stage: lint
  image: python:3.13-slim
  timeout: 5m
  interruptible: true
  needs: []
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  script:
    - python scripts/release_notes.py check "$CI_COMMIT_TAG"

lint:
  extends: .shared-setup
  stage: lint
  needs: []
  variables:
    VERSION: "3.11"
    # The one job that writes the shared download cache; every other job pulls.
    # `lint` is in the first stage, so a refreshed entry is available to the rest
    # of the pipeline.
    UV_DOWNLOAD_CACHE_POLICY: "pull-push"
  script:
    # --no-install-project mirrors the old --no-root: pre-commit lints the
    # source tree and never imports datamaite. --no-sync then keeps `uv run`
    # from re-syncing (and thus installing) the project it just skipped.
    - uv sync --locked --extra dev --no-install-project
    - uv run --no-sync pre-commit run --all-files
    # requirements.txt is a generated SCA input for the dr-compliance component,
    # which parses the tree and does not read uv.lock. Fail on drift so the scan
    # can never silently go stale while uv.lock moves on.
    - |
      scripts/export-requirements.sh /tmp/requirements.expected
      if ! diff -q requirements.txt /tmp/requirements.expected; then
        echo "requirements.txt has drifted from uv.lock -- regenerate it with:"
        echo "  scripts/export-requirements.sh"
        exit 1
      fi

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
pyright:
  extends: .shared-setup
  stage: typecheck
  needs: []
  variables:
    VERSION: "3.11"
  script:
    # Task extras (all) + maite so cv2/numpy/av/maite resolve and pyright
    # stays at 0 warnings; dev for the toolchain.
    - uv sync --locked --extra dev --extra maite --extra all
    - uv run --no-sync pyright src/

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
build:
  extends: .shared-setup
  stage: build
  needs: []
  variables:
    VERSION: "3.13"
  script:
    - uv build
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
      uv run --no-project --with "packaging==26.2" python - "$CI_COMMIT_TAG" <<'PY'
      import sys
      from pathlib import Path
      from packaging.utils import parse_sdist_filename, parse_wheel_filename
      from packaging.version import Version

      expected = Version(sys.argv[1])
      matched = 0
      for artifact in Path("dist").iterdir():
          if artifact.suffix == ".whl":
              _, version, _, _ = parse_wheel_filename(artifact.name)
          elif artifact.name.endswith(".tar.gz"):
              _, version = parse_sdist_filename(artifact.name)
          else:
              continue
          matched += 1
          if version != expected:
              raise SystemExit(
                  f"Built artifact {artifact.name} has version {version}, expected tag version {expected}."
              )

      if matched == 0:
          raise SystemExit("No wheel or sdist artifacts were built in dist/.")
      print(f"Verified {matched} artifact(s) for version {expected}.")
      PY
      fi
    - |
      status="$(git status --porcelain)"
      if [ -n "$status" ]; then
        echo "Build left tracked/unignored worktree changes:"
        printf '%s\n' "$status"
        exit 1
      fi
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Publish the tagged release to TestPyPI/PyPI (#85). Pushing a tag X.Y.Z runs
# the full validation pipeline (lint/typecheck/build/test + changelog-check) on
# the tag, then publishes to TestPyPI automatically; publish-pypi is a manual
# approval gate in the same tag pipeline; gitlab-release then records the
# release from the changelog. There is no web form and no version-bump commit:
# the tag is the single source of truth (uv-dynamic-versioning) and the build
# fails on any .devN/+dirty derivation, so #58 cannot recur silently.
# PyPI and TestPyPI use API tokens because PyPI/TestPyPI have not yet onboarded
# gitlab.jatic.net as a trusted self-managed GitLab issuer; the tag pipeline is
# shaped so swapping token auth for OIDC later is a one-job change (#62).
.publish-python-package:
  stage: publish
  image: python:3.13-slim
  # Auto-retry infrastructure failures only (autoscaled runners die sometimes);
  # upload idempotency (--skip-existing + digest verify) makes that safe.
  retry:
    max: 1
    when: runner_system_failure
  interruptible: false
  resource_group: pypi-publish
  timeout: 20m
  # Publish jobs build release artifacts from the tag checkout and should not
  # download artifacts from earlier stages; those reports make the worktree dirty.
  dependencies: []
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: never
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # No pip self-upgrade here: the publish toolchain must not float between a
    # release and its recovery re-run (digest verification requires the retry
    # rebuild to be byte-identical).
    # uv builds. twine and check-wheel-contents only inspect and upload the
    # finished artifacts, so they take no part in producing them and their
    # versions cannot affect byte-identical rebuilds -- they stay pip-installed
    # and pinned simply because one pinned install line covers all three.
    # Moving them to `uv tool`/`uvx` is viable; it would trade a pinned install
    # for an ephemeral resolve during a release upload.
    # `packaging` is explicit: the three inline `python - <<PY` heredocs below
    # (tag-version assert, post-upload digest verifier) import packaging.utils.
    # `pip install poetry` used to supply it incidentally; the uv wheel has no
    # dependencies, so without this it would arrive only as an unpinned
    # transitive of twine -- and the digest verifier runs *after* twine upload,
    # where losing it fails mid-release. Version matches the constraints file.
    - pip install --quiet "uv==${UV_PIN}" "twine==6.2.0" "check-wheel-contents==0.6.3" "packaging==26.2"
    # The PEP 517 build environment is pinned by UV_BUILD_CONSTRAINT in the
    # top-level `variables:` block, which this job inherits -- uv resolves its
    # own build env and never reads PIP_CONSTRAINT. Nothing to re-export here.
    - python --version
    - uv --version
    - twine --version
    - check-wheel-contents --version
  script:
    - |
      set -euo pipefail

      RELEASE_TAG="$CI_COMMIT_TAG"
      # Defense in depth: same shape the workflow rule admits (X.Y.Z plus the
      # suffixes uv-dynamic-versioning can build). Leading zeros are rejected
      # everywhere a number appears: Version("01.02.03") == Version("1.2.3"),
      # so a non-canonical tag would slip past the exact-version assert below
      # while publishing under a different spelling than the tag.
      if ! [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-(rc|alpha|beta)(0|[1-9][0-9]*)|[.](post|dev)(0|[1-9][0-9]*))?$ ]]; then
        echo "Tag '$RELEASE_TAG' must match X.Y.Z (optionally -rcN/-alphaN/-betaN/.postN/.devN), no 'v' prefix, no leading zeros."
        exit 1
      fi

      if [ "${PYPI_ENVIRONMENT_NAME}" = "TestPyPI" ]; then
        if [ -z "${TEST_PYPI_API_TOKEN:-}" ]; then
          echo "TEST_PYPI_API_TOKEN is not available; add a masked/protected TestPyPI API token in GitLab CI/CD variables (and protect the X.Y.Z tag pattern so protected variables reach tag pipelines)."
          exit 1
        fi
        export TWINE_USERNAME="__token__"
        export TWINE_PASSWORD="$TEST_PYPI_API_TOKEN"
      else
        if [ -z "${PYPI_API_TOKEN:-}" ]; then
          echo "PYPI_API_TOKEN is not available; add a masked/protected PyPI API token in GitLab CI/CD variables (and protect the X.Y.Z tag pattern so protected variables reach tag pipelines)."
          exit 1
        fi
        export TWINE_USERNAME="__token__"
        export TWINE_PASSWORD="$PYPI_API_TOKEN"
      fi

      echo "Publish of ${RELEASE_TAG} to ${PYPI_ENVIRONMENT_NAME} triggered by ${GITLAB_USER_LOGIN:-tag-push} at $(date -u +%FT%TZ)."

      # A release records what main shipped: refuse tags on side branches.
      git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/${CI_DEFAULT_BRANCH}"; then
        echo "Tag ${RELEASE_TAG} (${CI_COMMIT_SHA}) is not on origin/${CI_DEFAULT_BRANCH}."
        exit 1
      fi

      # The pipeline already checked out the tag; build straight from it.
      rm -rf dist/
      uv build
      twine check dist/*
      check-wheel-contents dist/*.whl

      # Exact-match version assertion (#58 guardrail): the derived version must
      # equal the tag -- any .devN / +dirty / +g<sha> suffix fails the release.
      python - "$RELEASE_TAG" <<'PY'
      import sys
      from pathlib import Path
      from packaging.utils import parse_sdist_filename, parse_wheel_filename
      from packaging.version import Version

      expected = Version(sys.argv[1])
      matched = 0
      for artifact in Path("dist").iterdir():
          if artifact.suffix == ".whl":
              _, version, _, _ = parse_wheel_filename(artifact.name)
          elif artifact.name.endswith(".tar.gz"):
              _, version = parse_sdist_filename(artifact.name)
          else:
              continue
          matched += 1
          if version != expected:
              raise SystemExit(
                  f"Built artifact {artifact.name} has version {version}, expected tag version {expected}."
              )

      if matched == 0:
          raise SystemExit("No wheel or sdist artifacts were built in dist/.")
      print(f"Verified {matched} artifact(s) for version {expected}.")
      PY
      status="$(git status --porcelain)"
      if [ -n "$status" ]; then
        echo "Build left tracked/unignored worktree changes:"
        printf '%s\n' "$status"
        exit 1
      fi

      # A repository can accept one artifact and then lose the response, leaving
      # the release partially published. Bound the network wait and make retries
      # continue past artifacts the index has already accepted.
      timeout --signal=TERM --kill-after=30s 5m \
        twine upload --non-interactive --disable-progress-bar --skip-existing dist/*

      # Do not let --skip-existing hide a conflicting artifact. Wait for the
      # package index to become consistent, then compare every remote digest
      # with the artifact built from the release tag (checkmaite !610 pattern).
      python - "$PYPI_ENVIRONMENT_NAME" "$RELEASE_TAG" <<'PY'
      import hashlib
      import json
      import sys
      import time
      import urllib.error
      import urllib.request
      from pathlib import Path

      from packaging.version import Version

      attempts = 12
      request_timeout_seconds = 5
      retry_interval_seconds = 5
      maximum_wait_seconds = (
          attempts * request_timeout_seconds + (attempts - 1) * retry_interval_seconds
      )

      environment, version = sys.argv[1:]
      host = "https://test.pypi.org" if environment == "TestPyPI" else "https://pypi.org"
      release_url = f"{host}/pypi/datamaite/{Version(version)}/json"
      local_digests = {
          artifact.name: hashlib.sha256(artifact.read_bytes()).hexdigest()
          for artifact in Path("dist").iterdir()
          if artifact.suffix == ".whl" or artifact.name.endswith(".tar.gz")
      }

      remote_digests = {}
      for attempt in range(attempts):
          try:
              with urllib.request.urlopen(release_url, timeout=request_timeout_seconds) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404 and exc.code < 500:
                  raise
          except (urllib.error.URLError, TimeoutError):
              pass
          else:
              remote_digests = {item["filename"]: item["digests"]["sha256"] for item in release["urls"]}
              if local_digests.keys() <= remote_digests.keys():
                  break
          if attempt + 1 < attempts:
              time.sleep(retry_interval_seconds)
      else:
          missing = sorted(local_digests.keys() - remote_digests.keys())
          raise SystemExit(
              f"Published release did not expose all artifacts after {attempts} attempts "
              f"(up to {maximum_wait_seconds} seconds): {missing}"
          )

      mismatched = sorted(
          filename
          for filename, digest in local_digests.items()
          if remote_digests[filename] != digest
      )
      if mismatched:
          raise SystemExit(f"Published artifact digest mismatch: {mismatched}")
      print(f"Verified {len(local_digests)} published artifact digest(s) for {version}.")
      PY

publish-testpypi:
  extends: .publish-python-package
  stage: publish-test
  environment:
    name: pypi-test
    url: https://test.pypi.org/project/datamaite/
  variables:
    PYPI_ENVIRONMENT_NAME: "TestPyPI"
    TWINE_REPOSITORY_URL: "https://test.pypi.org/legacy/"
  rules:
    # Automatic on every release tag, after the tag pipeline's validation
    # stages (lint/typecheck/build/test + changelog-check) succeed.
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never

publish-pypi:
  extends: .publish-python-package
  environment:
    name: pypi-production
    url: https://pypi.org/project/datamaite/
  variables:
    PYPI_ENVIRONMENT_NAME: "PyPI"
    TWINE_REPOSITORY_URL: "https://upload.pypi.org/legacy/"
  needs: [publish-testpypi]
  rules:
    # The one human decision in a release: approve the production upload from
    # the same tag pipeline once TestPyPI is verified.
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: false
    - when: never

# Create the GitLab Release once publish-pypi succeeds, so the Releases page
# records exactly what shipped to PyPI. The notes are the tag's CHANGELOG.md
# section (guaranteed non-empty by changelog-check at the top of this same
# pipeline). Idempotent: an existing release is left untouched, so retrying
# the pipeline never fails here.
gitlab-release:
  stage: release
  image: python:3.13-slim
  timeout: 10m
  # Reads only the checkout; no artifacts from earlier stages.
  dependencies: []
  needs: [publish-pypi]
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail

      NOTES="$(python scripts/release_notes.py extract "$CI_COMMIT_TAG")"
      export NOTES

      python - "$CI_COMMIT_TAG" <<'PY'
      import json
      import os
      import re
      import sys
      import urllib.error
      import urllib.request

      tag = sys.argv[1]
      # PEP 440 canonical form for the PyPI URL: pre-release tags like
      # 0.5.0-rc1 / 0.5.0-alpha1 / 0.5.0-beta1 live at 0.5.0rc1 / 0.5.0a1 /
      # 0.5.0b1 on PyPI ( .postN / .devN are already canonical).
      pypi_version = re.sub(
          r"-(rc|alpha|beta)(\d+)$",
          lambda m: {"rc": "rc", "alpha": "a", "beta": "b"}[m.group(1)] + m.group(2),
          tag,
      )
      api = f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/releases"
      auth = {"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]}

      # Idempotency: a retried pipeline must not fail on the existing release.
      try:
          with urllib.request.urlopen(urllib.request.Request(f"{api}/{tag}", headers=auth)):
              print(f"Release {tag} already exists; nothing to do.")
              raise SystemExit(0)
      except urllib.error.HTTPError as exc:
          if exc.code != 404:
              raise

      notes = os.environ["NOTES"].strip() + (
          f"\n\nPublished to PyPI: https://pypi.org/project/datamaite/{pypi_version}/"
      )
      payload = json.dumps({"tag_name": tag, "name": tag, "description": notes}).encode()
      request = urllib.request.Request(
          api,
          data=payload,
          method="POST",
          headers={**auth, "Content-Type": "application/json"},
      )
      with urllib.request.urlopen(request) as response:
          print(f"Created release {tag}: {json.load(response)['_links']['self']}")
      PY

# Builds Sphinx HTML and publishes to GitLab Pages on every push to the default branch.
pages:
  extends: .shared-setup
  stage: pages
  variables:
    VERSION: "3.12"
  script:
    - *clone_example_data
    # docs extra bundles the Sphinx toolchain and notebook/all/maite runtime
    # deps the tutorial notebooks import when myst-nb executes them.
    # `uv sync` installs the root project through the hatchling backend, so the
    # executed tutorial notebooks print the SCM-derived version -- no separate
    # reinstall step is needed to dodge a develop-install placeholder.
    - uv sync --locked --extra docs
    - uv run --no-sync sphinx-build -b html docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never

# Builds a Sphinx HTML preview for every merge request.
# The rendered docs are accessible via the "Documentation Preview" artifact link in the MR.
pages-preview:
  extends: .shared-setup
  stage: pages
  variables:
    VERSION: "3.12"
  script:
    - *clone_example_data
    # docs extra bundles the Sphinx toolchain and notebook/all/maite runtime
    # deps the tutorial notebooks import when myst-nb executes them.
    # `uv sync` installs the root project through the hatchling backend, so the
    # executed tutorial notebooks print the SCM-derived version -- no separate
    # reinstall step is needed to dodge a develop-install placeholder.
    - uv sync --locked --extra docs
    - uv run --no-sync sphinx-build -b html docs public
  artifacts:
    expose_as: "Documentation Preview"
    paths:
      - public/
  environment:
    name: docs-preview/$CI_MERGE_REQUEST_IID
    url: "https://gitlab.jatic.net/jatic/orchestration-interoperability/datamaite/-/jobs/$CI_JOB_ID/artifacts/public/index.html"
    auto_stop_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: never

# ---------------------------------------------------------------------------
# Test matrix (Python 3.10, 3.11, 3.12, 3.13, 3.14)
# ---------------------------------------------------------------------------
.test-base:
  extends: .shared-setup
  stage: test
  timeout: 30m
  script:
    # all (cv2/av) media decoders + maite extra (maite/numpy/av) so the
    # datamaite.maite tests run and count toward the 90% coverage gate; dev tooling.
    - uv sync --locked --extra dev --extra maite --extra all
    - uv run --no-sync pytest tests -vvv --cov=datamaite --cov-report term-missing
        --cov-report xml:coverage_report.xml --cov-fail-under=90
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - coverage_report.xml
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_report.xml

test-py310:
  extends: .test-base
  variables:
    VERSION: "3.10"

test-py311:
  extends: .test-base
  variables:
    VERSION: "3.11"

test-py312:
  extends: .test-base
  variables:
    VERSION: "3.12"

test-py313:
  extends: .test-base
  variables:
    VERSION: "3.13"

test-py314:
  extends: .test-base
  variables:
    VERSION: "3.14"

# ---------------------------------------------------------------------------
# Integration (e2e): cross-format conversion matrix against the shared example-data
# repo (jatic/orchestration-interoperability/datamaite-example-datasets). Loads
# every input format and round-trips it through every box output format,
# asserting the counts in tests/e2e/test_example_data_matrix.py. These e2e tests
# live under tests/e2e/ (vs. the always-on hermetic suite in tests/); see
# tests/README.md for the two-tier layout.
#
# Runs the opt-in `integration` marker only, with the coverage gate disabled
# (the matrix exercises a subset, not the whole package). Dataset data is fetched
# with git-LFS via CI_JOB_TOKEN. The datamaite-example-datasets project
# allowlists this project under Settings -> CI/CD -> Job token permissions,
# so the cross-repo clone + LFS pull is authorized and gates the pipeline.
# ---------------------------------------------------------------------------
integration:
  extends: .shared-setup
  stage: test
  timeout: 30m
  variables:
    VERSION: "3.12"
  allow_failure: false
  script:
    # Clone the shared example datasets and export DATAMAITE_DATASETS_ROOT.
    # Clones the default branch (main): the multi-format datasets/<format>/
    # layout and the counts this matrix asserts are merged there.
    - *clone_example_data
    - uv sync --locked --extra dev --extra maite --extra all
    # -s so the end-of-run matrix summary table is shown in the job log.
    # Scope to tests/e2e (the e2e tier) and the `integration` marker.
    - uv run --no-sync pytest tests/e2e -m integration -v -s --cov-fail-under=0

# ---------------------------------------------------------------------------
# E2E: S3 object storage tier, against a real S3-API server (MinIO), not the
# fsspec memory:// filesystem the coverage-gated unit suite's cloud tests use.
# This is a separate TIER from the coverage-gated matrix, not a separate
# stage: the separation is structural (integration marker, --no-cov, only
# tests/e2e/test_s3_minio.py), so the job shares the `test` stage with the
# matrix -- like the `integration` job above -- and runs concurrently with
# it instead of serializing behind it. See tests/README.md for the local run
# instructions and the two-tier rationale.
# The job also mirrors the shared example HMIE dataset into the S3 service to
# assert cloud/local parity on real data (TestExampleDatasetParity).
# ---------------------------------------------------------------------------
e2e-s3:
  extends: .shared-setup
  stage: test
  timeout: 30m
  # Required gate: a real S3-API regression must fail the pipeline, not be
  # silently tolerated. Mirrors the `integration` job's stance. The default
  # retry policy (retry.when: runner_system_failure) already re-runs the
  # docker-machine provisioning flake without masking genuine test failures.
  allow_failure: false
  variables:
    VERSION: "3.12"
    # Pinned to the last MinIO release under the Apache License 2.0 -- the
    # project relicensed to AGPLv3 immediately after this tag. License
    # verified at this tag; do not bump past it. Hoisted to a variable so the
    # service image and the tests/README.md local-run docker command stay in
    # sync from one place (keep them in sync when this changes).
    MINIO_E2E_IMAGE: "minio/minio:RELEASE.2021-04-22T15-44-28Z"
    MINIO_ROOT_USER: "datamaite-e2e"
    MINIO_ROOT_PASSWORD: "datamaite-e2e-secret"
    DATAMAITE_S3_E2E_ENDPOINT: "http://s3:9000"
    # Throwaway, service-local credentials: intentionally inline and unmasked
    # because they only authenticate against the ephemeral MinIO service in
    # this job. NEVER copy this pattern with real credentials -- those belong
    # in masked/protected CI/CD variables.
    DATAMAITE_S3_E2E_KEY: "datamaite-e2e"
    DATAMAITE_S3_E2E_SECRET: "datamaite-e2e-secret"
    # Stream the MinIO service container's logs into the job trace, so a
    # service that fails to start is diagnosable from the trace alone.
    CI_DEBUG_SERVICES: "true"
  services:
    # GitLab expands variables in `services:name`, so the pinned image lives in
    # MINIO_E2E_IMAGE (see the license-pin comment there).
    - name: "${MINIO_E2E_IMAGE}"
      alias: "s3"
      command: ["server", "/data"]
    # NOTE: this pulls minio/minio anonymously from Docker Hub, which is
    # subject to Docker Hub's anonymous pull-rate limits. A follow-up could
    # route it through the GitLab dependency proxy
    # (${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/minio/minio:...), but that
    # requires verifying the group has the dependency proxy enabled first --
    # do NOT switch the image path until that is confirmed.
  script:
    - |
      # Mirrors the .clone_example_data anchor but must NOT fail the job: only
      # the parity test (TestExampleDatasetParity) needs the example data and
      # it self-skips when DATAMAITE_DATASETS_ROOT is unset. Script lines share
      # one shell, so the export below persists to the pytest step.
      if git config --global --add safe.directory "$CI_PROJECT_DIR" \
        && git lfs install \
        && git clone --depth 1 \
             "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/datamaite-example-datasets.git" \
             "${CI_PROJECT_DIR}/example-data" \
        && git -C "${CI_PROJECT_DIR}/example-data" lfs pull; then
        export DATAMAITE_DATASETS_ROOT="${CI_PROJECT_DIR}/example-data/datasets"
        echo "Example datasets cloned; parity test will run."
      else
        echo "NOTICE: example-data clone/lfs pull failed; TestExampleDatasetParity self-skips."
      fi
    # aws (s3fs) for the storage_options plumbing under test, fmv (opencv/av)
    # for the factory-built mp4s and video probing; dev for the toolchain.
    - uv sync --locked --extra dev --extra aws --extra fmv
    # The slim image has no curl, so poll the MinIO health endpoint from
    # Python (~30 x 2s) and fail loudly if the service never comes up.
    - |
      uv run --no-sync python -c '
      import os, sys, time, urllib.request
      url = os.environ["DATAMAITE_S3_E2E_ENDPOINT"].rstrip("/") + "/minio/health/live"
      for attempt in range(30):
          try:
              with urllib.request.urlopen(url, timeout=2) as resp:
                  if resp.status == 200:
                      print("MinIO ready after %d attempt(s)" % attempt)
                      break
          except Exception as exc:
              print("waiting for MinIO (%d/30): %s" % (attempt + 1, type(exc).__name__))
          time.sleep(2)
      else:
          sys.exit("MinIO service at %s never became ready" % url)
      '
    - uv run --no-sync pytest tests/e2e/test_s3_minio.py -m integration --no-cov -q

# ---------------------------------------------------------------------------
# DR Compliance (JATIC program requirement)
#
# allow_failure: true -- dr-compliance scans can produce false positives
# against transitive deps. Failing scans are visible in the UI and triaged
# async, not hidden.
# ---------------------------------------------------------------------------
include:
  # Component address and base image come from project CI/CD variables
  # (DR_COMPLIANCE_COMPONENT, DR_COMPLIANCE_IMAGE) so the URLs are not in the
  # tracked file. The version is pinned here.
  - component: ${DR_COMPLIANCE_COMPONENT}@0.5.2
    inputs:
      stage: dr-compliance
      # tests: hermetic test suite (standard SAST exclusion).
      # tools: developer-only benchmark/diagnostic scripts (see tools/*/README).
      #   They never ship -- the wheel packages only src/datamaite and the
      #   sdist builds from an explicit src+tests allowlist -- so they are
      #   scanned by the local toolchain (ruff S-rules, bandit) but excluded
      #   from the compliance SAST tier like the tests they support.
      sast_excluded_paths: tests, tools
      image: ${DR_COMPLIANCE_IMAGE}
      full_execution_on_commit: true
      allow_failure: true
